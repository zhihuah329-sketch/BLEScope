name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - name: GUI simulation smoke check
        run: |
          python qt_app.py --self-check
          python -c "import json; r=json.load(open('qt_self_check.json')); assert r['ok'], r"
